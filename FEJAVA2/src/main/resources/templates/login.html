<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hệ thống Quản Lý Kho - Modern Login Interface">
    <title>Đăng Nhập - Hệ Thống Quản Lý Kho</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts - Inter for Apple-like feel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cyber-blue: #00f2ff;
            --cyber-purple: #7000ff;
            --cyber-cyan: #0ff;
            --cyber-dark: #050505;
            --cyber-darker: #000;
            --cyber-border: rgba(0, 242, 255, 0.3);
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--cyber-dark);
            position: relative;
            margin: 0;
            padding: 0;
        }

        /* Auth Container */
        .auth-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1;
        }

        /* 3D Background Canvas */
        #vanta-canvas {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
        }

        /* Glassmorphism Login Card with Cyberpunk Colors */
        .login-box {
            background: rgba(10, 20, 30, 0.8);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--cyber-border);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 3rem 2.5rem;
            position: relative;
            box-shadow:
                0 0 60px rgba(0, 242, 255, 0.15),
                inset 0 0 30px rgba(0, 242, 255, 0.05),
                0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 242, 255, 0.1) 0%, transparent 50%);
            animation: floatBg 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, 20px); }
        }

        .login-box:hover {
            box-shadow:
                0 0 80px rgba(0, 242, 255, 0.2),
                inset 0 0 40px rgba(0, 242, 255, 0.08),
                0 12px 48px rgba(0, 0, 0, 0.4);
            transform: translateY(-4px);
        }

        /* Header Section */
        .header-section {
            text-align: center;
            margin-bottom: 2.5rem;
            position: relative;
            z-index: 2;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, var(--cyber-blue) 0%, var(--cyber-purple) 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header-section h1 {
            font-family: 'Poppins', sans-serif;
            color: var(--cyber-blue);
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.4);
            letter-spacing: -0.5px;
        }

        .header-section p {
            font-size: 0.95rem;
            color: rgba(0, 242, 255, 0.6);
            font-weight: 400;
            margin: 0;
        }

        /* Alert Styling */
        .alert {
            border: 1px solid rgba(0, 242, 255, 0.4);
            background: rgba(0, 242, 255, 0.1);
            color: var(--cyber-cyan);
            border-radius: 16px;
            padding: 1rem;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            z-index: 2;
        }

        .alert.alert-danger {
            border-color: rgba(255, 59, 48, 0.4);
            background: rgba(255, 59, 48, 0.1);
            color: #ff6b6b;
        }

        .alert i {
            margin-right: 0.75rem;
            font-size: 1.1rem;
        }

        .btn-close {
            color: var(--cyber-cyan) !important;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .alert.alert-danger .btn-close {
            color: #ff6b6b !important;
        }

        .btn-close:hover {
            opacity: 1;
        }

        /* Form Container */
        .form-container {
            position: relative;
            z-index: 2;
        }

        /* Form Group */
        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(0, 242, 255, 0.8);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group label i {
            margin-right: 0.5rem;
        }

        /* Form Control - Glassmorphism Input */
        .form-control {
            border: 1.5px solid rgba(0, 242, 255, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .form-control::placeholder {
            color: rgba(0, 242, 255, 0.4);
        }

        .form-control:focus {
            border-color: var(--cyber-blue);
            background: rgba(0, 242, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2),
                        inset 0 2px 8px rgba(0, 242, 255, 0.1);
            outline: none;
            color: white;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(0, 242, 255, 0.5);
            font-size: 1.1rem;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .form-control:focus ~ i {
            color: var(--cyber-blue);
        }

        .form-control.with-icon {
            padding-right: 40px;
        }

        /* Form Feedback */
        .invalid-feedback {
            display: block;
            color: #ff6b6b;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        /* Submit Button */
        .btn-login {
            background: transparent;
            border: 1.5px solid var(--cyber-blue);
            color: var(--cyber-blue);
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 0;
            width: 100%;
            margin-top: 1.5rem;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--cyber-blue);
            transition: left 0.4s ease;
            z-index: -1;
        }

        .btn-login:hover::before {
            left: 0;
        }

        .btn-login:hover {
            color: #000;
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        .btn-login:disabled,
        .btn-login.loading {
            opacity: 0.7;
            pointer-events: none;
            cursor: not-allowed;
        }

        .btn-login.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 242, 255, 0.3);
            border-top-color: var(--cyber-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer-section {
            margin-top: 2rem;
            text-align: center;
            position: relative;
            z-index: 2;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(0, 242, 255, 0.2);
        }

        .footer-section p {
            font-size: 0.75rem;
            color: rgba(0, 242, 255, 0.5);
            margin: 0;
            font-weight: 400;
            letter-spacing: 1px;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .login-box {
                padding: 2rem 1.5rem;
                max-width: 100%;
            }

            .header-section h1 {
                font-size: 1.5rem;
            }

            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 1.75rem;
            }

            .form-control {
                padding: 11px 14px;
                font-size: 0.9rem;
            }

            .btn-login {
                padding: 11px 0;
                font-size: 0.95rem;
            }
        }

        /* Accessibility */
        .form-control:focus-visible {
            outline: 2px solid var(--cyber-blue);
            outline-offset: 2px;
        }

        /* Login/Signup Link */
        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            position: relative;
            z-index: 2;
        }

        .login-link p {
            font-size: 0.9rem;
            color: rgba(0, 242, 255, 0.7);
            margin: 0;
        }

        .login-link a {
            color: var(--cyber-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        .login-link a:hover {
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.6);
            transform: translateX(2px);
        }

        /* Smooth transition for all elements */
        button, input, select, textarea {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
<div th:replace="~{common/styles}"></div>

<!-- 3D Background Canvas -->
<div id="vanta-canvas"></div>
<!-- Auth Container -->
<div class="auth-container">
    <!-- Glassmorphism Login Card with Cyberpunk Colors -->
    <div class="login-box">
        <!-- Header Section -->
        <div class="header-section">
            <div class="logo-icon">
                <i class="fas fa-cube"></i>
            </div>
            <h1>Đăng Nhập Hệ Thống</h1>
            <p>Chào mừng trở lại! Vui lòng nhập thông tin đăng nhập của bạn.</p>
        </div>

        <!-- Error Alert -->
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <div style="flex-grow: 1;">
                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" th:object="${loginRequest}" method="post" class="needs-validation form-container" novalidate>

            <!-- Username Field -->
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i>Tên Đăng Nhập
                </label>
                <div class="input-wrapper">
                    <input type="text"
                           id="username"
                           th:field="*{username}"
                           class="form-control with-icon"
                           placeholder="Nhập tên đăng nhập"
                           required
                           aria-label="Username">
                    <i class="fas fa-check-circle" style="display: none;"></i>
                </div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                    Vui lòng nhập tên đăng nhập
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i>Mật Khẩu
                </label>
                <div class="input-wrapper">
                    <input type="password"
                           id="password"
                           th:field="*{password}"
                           class="form-control with-icon"
                           placeholder="Nhập mật khẩu"
                           required
                           aria-label="Password">
                    <i class="fas fa-check-circle" style="display: none;"></i>
                </div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                    Vui lòng nhập mật khẩu
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-login" id="loginBtn">
                <span class="btn-text">Khởi Tạo Đăng Nhập</span>
            </button>
        </form>

        <!-- Signup Link -->
        <div class="login-link">
            <p>Chưa có tài khoản? <a href="/register">Đăng Ký</a></p>
        </div>

        <!-- Footer Section -->
        <div class="footer-section">
            <p>&copy; 2026 WAREHOUSE MANAGEMENT SYSTEM</p>
        </div>
    </div>
</div>
<div th:replace="~{common/scripts :: footer_scripts}"></div>
<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Vanta.js 3D Background Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

<!-- External Script -->
<script src="/js/script.js"></script>

<!-- Main Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Initialize Vanta.js 3D Background
        let vantaEffect = VANTA.NET({
            el: "#vanta-canvas",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200,
            minWidth: 200,
            scale: 1,
            scaleMobile: 1,
            color: 0x00f2ff,
            backgroundColor: 0x050505,
            points: 15,
            maxDistance: 25,
            spacing: 18,
            speed: 0.8
        });

        const form = document.querySelector('form');
        const loginBtn = document.getElementById('loginBtn');
        const inputs = form.querySelectorAll('input');

        // Real-time input validation
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                if (input.value.trim()) {
                    input.classList.remove('is-invalid');
                }
            });

            input.addEventListener('blur', () => {
                if (!input.value.trim()) {
                    input.classList.add('is-invalid');
                } else {
                    input.classList.remove('is-invalid');
                }
            });
        });

        // Form submission
        form.addEventListener('submit', (e) => {
            if (!form.checkValidity()) {
                e.preventDefault();
                e.stopPropagation();

                inputs.forEach(input => {
                    if (!input.value.trim()) {
                        input.classList.add('is-invalid');
                    }
                });
            } else {
                // Show loading state
                loginBtn.classList.add('loading');
                const btnText = loginBtn.querySelector('.btn-text');
                btnText.innerHTML = '<span class="spinner"></span> ĐANG XÁC THỰC...';
                loginBtn.disabled = true;
            }
            form.classList.add('was-validated');
        });

        // Form reset validation
        const resetValidation = () => {
            form.classList.remove('was-validated');
            inputs.forEach(input => {
                input.classList.remove('is-invalid');
            });
        };

        // Reset on input focus
        inputs.forEach(input => {
            input.addEventListener('focus', resetValidation);
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (vantaEffect) vantaEffect.destroy();
        });
    });
</script>

</body>
</html>
</body>
</html>
